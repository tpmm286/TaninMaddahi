name: Delete Repository Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Delete Everything Except .github
        run: |
          set -e

          echo "🧹 حذف فایل‌های Repository..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          echo "✅ همه فایل‌ها به جز .github حذف شدند."

      - name: Commit And Push
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A -- . ':!.github'

          if git diff --cached --quiet; then
            echo "هیچ تغییری وجود ندارد."
          else
            git commit -m "Delete repository files except .github"
            git push
          fi
