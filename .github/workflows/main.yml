name: Extract ZIP and Replace Project

on:
  workflow_dispatch:

  push:
    paths:
      - '**/*.zip'

permissions:
  contents: write

jobs:
  extract-and-replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          echo "🔍 پیدا کردن فایل ZIP..."

          ZIP_FILE=$(find . -type f -name "*.zip" \
            -not -path "./.git/*" \
            -not -path "./.github/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ فایل ZIP پیدا نشد."
            exit 1
          fi

          echo "📦 ZIP پیدا شد: $ZIP_FILE"

          rm -rf /tmp/new-project
          mkdir -p /tmp/new-project

          echo "📂 استخراج ZIP..."
          unzip -q "$ZIP_FILE" -d /tmp/new-project

          echo "🛡️ حذف .github از محتوای ZIP..."
          rm -rf /tmp/new-project/.github

          echo "🧹 حذف فایل‌های قدیمی پروژه..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          echo "📥 انتقال پروژه جدید..."

          cp -a /tmp/new-project/. .

          echo "🗑️ حذف فایل ZIP..."
          find . -type f -name "*.zip" \
            ! -path "./.github/*" \
            -delete

          echo "✅ پروژه جایگزین شد."
          echo "🛡️ .github دست‌نخورده باقی ماند."

      - name: Commit and Push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "📦 اضافه کردن تغییرات پروژه..."

          # فقط فایل‌های خارج از .github
          git add -A -- . ':!.github'

          if git diff --cached --quiet; then
            echo "ℹ️ هیچ تغییری وجود ندارد."
          else
            git commit -m "Replace project with ZIP contents [skip ci]"
            git push
          fi
