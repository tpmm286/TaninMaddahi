name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # (اختیاری) آدرس سرور آنلاین برای استخراج هوشمند متن و گوگل درایو:
      # Settings → Secrets and variables → Actions → Variables → API_BASE_URL
      VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Patch Android project
        run: node scripts/patch-android.mjs

      - name: Generate icons and splash (non-fatal)
        run: |
          npx --yes @capacitor/assets generate --android \
            --iconBackgroundColor '#0f1d14' --iconBackgroundColorDark '#0f1d14' \
            --splashBackgroundColor '#090e0b' --splashBackgroundColorDark '#090e0b' \
            || echo "Icon generation skipped; default icon will be used."

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APKs (debug + release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p out

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            KS_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            K_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::warning::Signing secrets not set. Using a temporary key: this APK installs fine, but a later build signed with a different key cannot update it (uninstall first)."
            keytool -genkeypair -keystore release.keystore -alias maddahi \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass maddahi-temp -keypass maddahi-temp \
              -dname "CN=Tanin Maddahi, O=Tanin, C=IR"
            KS_PASS="maddahi-temp"
            ALIAS="maddahi"
            K_PASS="maddahi-temp"
          fi

          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$K_PASS" \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out out/TaninMaddahi-release.apk aligned.apk
          "$BT/apksigner" verify --verbose out/TaninMaddahi-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/TaninMaddahi-debug.apk
          rm -f release.keystore

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TaninMaddahi-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: طنین مداحی ${{ github.ref_name }}
          files: out/TaninMaddahi-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
