
      - name: Create Service Worker
        run: |
          cat > dist/sw.js <<'EOF'
          const CACHE_NAME = 'tanin-maddahi-v1';
          const BASE = '/TaninMaddahi/';

          self.addEventListener('install', event => {
            event.waitUntil(
              caches.open(CACHE_NAME).then(cache => cache.add(BASE))
            );
            self.skipWaiting();
          });

          self.addEventListener('activate', event => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(
                keys
                  .filter(key =>
                    key.startsWith('tanin-maddahi-') &&
                    key !== CACHE_NAME
                  )
                  .map(key => caches.delete(key))
              );
              await self.clients.claim();
            })());
          });

          self.addEventListener('fetch', event => {
            const request = event.request;
            const url = new URL(request.url);

            if (
              request.method !== 'GET' ||
              url.origin !== self.location.origin
            ) return;

            if (request.mode === 'navigate') {
              event.respondWith((async () => {
                try {
                  const response = await fetch(request);
                  if (response.ok) {
                    const cache = await caches.open(CACHE_NAME);
                    await cache.put(request, response.clone());
                  }
                  return response;
                } catch {
                  return (await caches.match(request)) ||
                         (await caches.match(BASE)) ||
                         Response.error();
                }
              })());
              return;
            }

            if (
              url.pathname.startsWith(BASE) &&
              /\.(js|css|png|jpe?g|svg|webp|woff2?)$/i.test(url.pathname)
            ) {
              event.respondWith((async () => {
                const cached = await caches.match(request);
                if (cached) return cached;

                const response = await fetch(request);
                if (response.ok) {
                  const cache = await caches.open(CACHE_NAME);
                  await cache.put(request, response.clone());
                }
                return response;
              })());
            }
          });
          EOF
