
name: Web PWA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-pwa-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web
        run: npm run build -- --base=/TaninMaddahi/

      - name: Generate PWA and favicon
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f assets/icon-only.png

          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

          mkdir -p dist/icons

          # App icons
          convert assets/icon-only.png -resize 192x192 dist/icons/icon-192.png
          convert assets/icon-only.png -resize 512x512 dist/icons/icon-512.png

          # Browser favicons
          convert assets/icon-only.png -resize 32x32 dist/favicon-32.png
          convert assets/icon-only.png -resize 16x16 dist/favicon-16.png
          convert assets/icon-only.png -resize 48x48 dist/favicon.ico

          # PWA manifest
          cat > dist/manifest.webmanifest <<'EOF'
          {
            "id": "/TaninMaddahi/",
            "name": "طنین مداحی",
            "short_name": "طنین مداحی",
            "description": "برنامه طنین مداحی",
            "lang": "fa",
            "dir": "rtl",
            "start_url": "/TaninMaddahi/",
            "scope": "/TaninMaddahi/",
            "display": "standalone",
            "background_color": "#090e0b",
            "theme_color": "#090e0b",
            "icons": [
              {
                "src": "/TaninMaddahi/icons/icon-192.png",
                "sizes": "192x192",
                "type": "image/png"
              },
              {
                "src": "/TaninMaddahi/icons/icon-512.png",
                "sizes": "512x512",
                "type": "image/png"
              }
            ]
          }
          EOF

          # Service Worker
          cat > dist/sw.js <<'EOF'
          const CACHE_NAME = 'tanin-maddahi-v2';
          const BASE = '/TaninMaddahi/';

          self.addEventListener('install', event => {
            self.skipWaiting();
          });

          self.addEventListener('activate', event => {
            event.waitUntil((async () => {
              const keys = await caches.keys();

              await Promise.all(
                keys
                  .filter(key =>
                    key.startsWith('tanin-maddahi-') &&
                    key !== CACHE_NAME
                  )
                  .map(key => caches.delete(key))
              );

              await self.clients.claim();
            })());
          });

          self.addEventListener('fetch', event => {
            const request = event.request;
            const url = new URL(request.url);

            if (
              request.method !== 'GET' ||
              url.origin !== self.location.origin ||
              !url.pathname.startsWith(BASE)
            ) {
              return;
            }

            if (request.mode === 'navigate') {
              event.respondWith((async () => {
                const cache = await caches.open(CACHE_NAME);

                try {
                  const response = await fetch(request);

                  if (response.ok) {
                    await cache.put(request, response.clone());
                  }

                  return response;
                } catch {
                  return (
                    await cache.match(request) ||
                    await cache.match(BASE) ||
                    Response.error()
                  );
                }
              })());

              return;
            }

            if (
              /\.(js|css|png|jpe?g|svg|webp|ico|woff2?|webmanifest)$/i
                .test(url.pathname)
            ) {
              event.respondWith((async () => {
                const cache = await caches.open(CACHE_NAME);
                const cached = await cache.match(request);

                if (cached) return cached;

                const response = await fetch(request);

                if (response.ok && response.type === 'basic') {
                  await cache.put(request, response.clone());
                }

                return response;
              })());
            }
          });
          EOF

          # Add manifest, favicon and Service Worker registration
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const file = 'dist/index.html';
          let html = fs.readFileSync(file, 'utf8');

          const headTags = `
          <link rel="manifest" href="/TaninMaddahi/manifest.webmanifest">
          <link rel="icon" href="/TaninMaddahi/favicon.ico" sizes="48x48">
          <link rel="icon" type="image/png" sizes="32x32" href="/TaninMaddahi/favicon-32.png">
          <link rel="icon" type="image/png" sizes="16x16" href="/TaninMaddahi/favicon-16.png">
          <meta name="theme-color" content="#090e0b">
          `;

          if (!html.includes('manifest.webmanifest')) {
            html = html.replace('</head>', `${headTags}\n</head>`);
          } else {
            if (!html.includes('favicon.ico')) {
              html = html.replace('</head>', `${headTags}\n</head>`);
            }
          }

          const registration = `
          <script>
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
              navigator.serviceWorker
                .register('/TaninMaddahi/sw.js', {
                  scope: '/TaninMaddahi/'
                })
                .catch(error => console.error('Service Worker:', error));
            });
          }
          </script>
          `;

          if (!html.includes('/TaninMaddahi/sw.js')) {
            html = html.replace('</body>', `${registration}\n</body>`);
          }

          fs.writeFileSync(file, html);
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
