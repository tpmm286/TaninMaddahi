
      - name: Generate PWA files
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

          mkdir -p dist/icons

          convert assets/icon-only.png -resize 192x192 dist/icons/icon-192.png
          convert assets/icon-only.png -resize 512x512 dist/icons/icon-512.png

          cat > dist/manifest.webmanifest <<'EOF'
          {
            "id": "/TaninMaddahi/",
            "name": "طنین مداحی",
            "short_name": "طنین مداحی",
            "description": "همگام‌ساز صوت و متن نوحه",
            "lang": "fa",
            "dir": "rtl",
            "start_url": "/TaninMaddahi/",
            "scope": "/TaninMaddahi/",
            "display": "standalone",
            "background_color": "#090e0b",
            "theme_color": "#090e0b",
            "icons": [
              {
                "src": "/TaninMaddahi/icons/icon-192.png",
                "sizes": "192x192",
                "type": "image/png"
              },
              {
                "src": "/TaninMaddahi/icons/icon-512.png",
                "sizes": "512x512",
                "type": "image/png"
              }
            ]
          }
          EOF

          cat > dist/sw.js <<'EOF'
          const CACHE = 'tanin-maddahi-v1';
          const BASE = '/TaninMaddahi/';

          self.addEventListener('install', event => {
            event.waitUntil(
              caches.open(CACHE).then(cache => cache.add(BASE))
            );
            self.skipWaiting();
          });

          self.addEventListener('activate', event => {
            event.waitUntil(
              caches.keys().then(keys =>
                Promise.all(
                  keys.filter(key => key.startsWith('tanin-maddahi-') && key !== CACHE)
                    .map(key => caches.delete(key))
                )
              )
            );
            self.clients.claim();
          });

          self.addEventListener('fetch', event => {
            const req = event.request;
            const url = new URL(req.url);

            if (req.method !== 'GET' || url.origin !== self.location.origin) return;

            if (req.mode === 'navigate') {
              event.respondWith(
                fetch(req).catch(async () => {
                  const cache = await caches.open(CACHE);
                  return (await cache.match(BASE)) || Response.error();
                })
              );
              return;
            }

            if (url.pathname.startsWith(BASE) &&
                /\.(js|css|png|svg|woff2?)$/i.test(url.pathname)) {
              event.respondWith(
                caches.match(req).then(cached =>
                  cached || fetch(req).then(response => {
                    if (response.ok) {
                      const copy = response.clone();
                      caches.open(CACHE).then(cache => cache.put(req, copy));
                    }
                    return response;
                  })
                )
              );
            }
          });
          EOF

          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const file = 'dist/index.html';
          let html = fs.readFileSync(file, 'utf8');

          html = html.replace(
            '</head>',
            '  <link rel="manifest" href="/TaninMaddahi/manifest.webmanifest">\n</head>'
          );

          html = html.replace(
            '</body>',
            '  <script>if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/TaninMaddahi/sw.js", { scope: "/TaninMaddahi/" }));</script>\n</body>'
          );

          fs.writeFileSync(file, html);
          EOF
